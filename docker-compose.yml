# Every setting has a ${VAR:-default}; an optional .env (copy of .env.example) overrides them.

services:
  api:
    build:
      context: .
      target: api
    ports:
      # Port taken? Set API_PORT in .env.
      - "${API_PORT:-3000}:3000"
    environment:
      # Inside compose the database is always the "db" service, so no override.
      DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@db:5432/bootcamp
      APP_ENV: ${APP_ENV:-local}
      SERVICE_NAME: ${SERVICE_NAME:-bootcamp-api}
      # Study default only; a real system would have no default token.
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-default_token}
      # Only variables listed here reach the container (inherited, unused connector).
      BANKSLIP_API_URL: ${BANKSLIP_API_URL:-http://localhost:8080}
      BANKSLIP_API_INTERNAL_TOKEN: ${BANKSLIP_API_INTERNAL_TOKEN:-default_token}
      BANKSLIP_API_TIMEOUT: ${BANKSLIP_API_TIMEOUT:-5}
    volumes:
      # Source mounted for --reload.
      - ./src:/app
    command: uvicorn app:app --host 0.0.0.0 --port 3000 --no-server-header --reload
    healthcheck:
      # Started is not ready: make up/test wait for healthy before the first request.
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:3000/health_check\")'"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy

  worker:
    # Cold path: api image plus numpy (Dockerfile target worker). No port, no healthcheck.
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@db:5432/bootcamp
      APP_ENV: ${APP_ENV:-local}
      SERVICE_NAME: ${SERVICE_NAME:-bootcamp-worker}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-default_token}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-30}
      WORKER_LOOKBACK_HOURS: ${WORKER_LOOKBACK_HOURS:-72}
    volumes:
      - ./src:/app
    command: python -m worker
    depends_on:
      db:
        condition: service_healthy

  db:
    build: ./database/.
    environment:
      POSTGRES_USER: bootcamp
      POSTGRES_PASSWORD: bootcamp
      POSTGRES_DB: bootcamp
    ports:
      # Port taken? Set DB_PORT in .env.
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      # The api starts only after the database answers.
      test: ["CMD-SHELL", "pg_isready -U bootcamp -d bootcamp"]
      interval: 3s
      timeout: 3s
      retries: 20

